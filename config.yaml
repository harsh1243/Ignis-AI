models:
  detector: weights/detector.pt
  verifier: weights/verifier.pt
  use_verifier: true
input:
  imgsz: 800
  target_fps: 5
  max_frames: null
detector:
  conf: 0.2
  iou: 0.5
  max_det: 50
  half: true
  min_box_px: 4
verifier:
  min_prob: 0.7
temporal:
  match_iou: 0.1
  match_center_dist: 1.0
  max_missed_s: 2.0
  event_timeout_s: 10.0
  fire:
    window_s: 1.0
    min_hit_ratio: 0.8
    min_mean_conf: 0.5
    moving_min_mean_conf: 0.8
    move_thresh: 1.0
  smoke:
    window_s: 2.0
    min_hit_ratio: 0.6
    min_mean_conf: 0.4
    moving_min_mean_conf: 0.7
    move_thresh: 1.5
output:
  log_unverified: false
